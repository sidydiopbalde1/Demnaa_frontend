name: demnaa_front
description: "Demnaa flutter"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  flutter_map: ^6.0.1
  # geolocator: ^11.0.0
  latlong2: ^0.9.0
  http: ^1.2.0
  flutter_dotenv: ^5.1.0
  permission_handler: ^11.1.0
  cupertino_icons: ^1.0.8
  file_picker: ^10.2.1
  shared_preferences: ^2.2.2
  dio: ^5.4.0
  url_launcher: ^6.1.12

  #url_launcher: ^6.2.2



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^4.0.0


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/demna_icone.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/demnaa_header.png
    - assets/images/demna_icone.png
    - assets/images/demnaa_icone_user.png
    - assets/images/demnaa_livraison_moto.png
    - assets/images/demna_moto_taxi.png
    - assets/images/demnaa_moto_sante.png
    - assets/images/user_map_icone.png
    - assets/images/demnaa_text.png
    - assets/images/demnaa_first_page.jpeg
    - assets/images/moto_taxi.png
    - assets/images/moto_livraison.png
    - assets/images/moto_bagage.png
    - assets/images/wave.png
    - assets/images/orange_money.png
    - assets/images/k_pay.png
    - assets/images/cash_money.png
    - assets/images/Frame.png
    - assets/images/mamadou.png
    - assets/images/carte_map.png